```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anam Digital Printing - Katalog Undangan</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #f5f5f5;
      overflow: hidden;
    }

    .loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      z-index: 10;
      font-family: Arial, sans-serif;
    }

    .loading-box {
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #ddd;
      border-top: 4px solid #333;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    iframe {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: white;
    }
  </style>
</head>

<body>

  <div class="loading" id="loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <div>Memuat katalog...</div>
    </div>
  </div>

  <iframe
    id="appsScript"
    src="https://script.google.com/macros/s/AKfycbxvckAsQeadIE_S466n_3ndyj7v_zThK0ij3uzRZkydbCWZ8AUtXYfK7a4--GzmmTP7/exec"
    allow="fullscreen">
  </iframe>

  <script>
    const iframe = document.getElementById("appsScript");
    const loading = document.getElementById("loading");

    iframe.addEventListener("load", function () {
      setTimeout(() => {
        loading.style.display = "none";
      }, 500);
    });
  </script>

</body>
</html>
```
